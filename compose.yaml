name: sproutsync
services:
  postgres:
    # Standalone experiments only; the workspace needs a full Supabase stack.
    profiles: [infrastructure]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sproutsync}
      POSTGRES_USER: ${POSTGRES_USER:-sproutsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  mqtt:
    profiles: [infrastructure]
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  api:
    build: ./backend/api
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL in the root .env}}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL:?Set SUPABASE_URL in the root .env}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in the root .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_SMTP_EMAIL: ${GOOGLE_SMTP_EMAIL:-}
      GOOGLE_APP_PASSWORD: ${GOOGLE_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-wss://broker.hivemq.com:8884/mqtt}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_STALE_SECONDS: ${MQTT_STALE_SECONDS:-30}
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
volumes:
  postgres-data:
