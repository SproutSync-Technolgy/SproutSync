name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Bash syntax and executable entry points
        run: |
          for file in start.sh stop.sh verify.sh scripts/linux-session.sh; do
            bash -n "$file"
          done
          test -x start.sh && test -x stop.sh && test -x verify.sh
      - name: Exercise isolated Linux launcher lifecycle
        run: python scripts/test_linux_launchers.py -v
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:setup
      - run: npm run test:dependencies
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check backend/api
      - run: python -m pytest backend/api/tests -q
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-firmware.txt
      - run: pio run --project-dir iot/esp32
