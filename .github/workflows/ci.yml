name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:setup
      - run: npm run test:dependencies
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check backend/api
      - run: python -m pytest backend/api/tests -q
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-firmware.txt
      - run: pio run --project-dir iot/esp32
