version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      npm-updates:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /backend/api
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      pip-updates:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
