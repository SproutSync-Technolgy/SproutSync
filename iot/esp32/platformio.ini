[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

; Optional read-only discovery example. It does not replace sensor firmware.
[env:discovery]
extends = env:esp32dev
build_src_filter = +<discovery_example.cpp>
build_flags = -DSPROUTSYNC_DISCOVERY_EXAMPLE
board_build.partitions = huge_app.csv
